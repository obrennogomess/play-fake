<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a2b"/>
      <stop offset="60%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#e50914" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="104" fill="none" stroke="#e50914" stroke-opacity="0.35" stroke-width="4"/>
  
  <!-- Subtle Glowing Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#e50914" stroke-opacity="0.2" stroke-width="3"/>
  
  <!-- Cineva C -->
  <path d="M 355 175 C 328 140 295 124 256 124 C 182 124 124 182 124 256 C 124 330 182 388 256 388 C 295 388 328 372 355 337" fill="none" stroke="url(#cGrad)" stroke-width="50" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Play triangle in center -->
  <polygon points="232,198 328,256 232,314" fill="url(#playGrad)"/>
  
  <!-- 4K IPTV Badge -->
  <rect x="200" y="415" width="112" height="34" rx="8" fill="#e50914"/>
  <text x="256" y="438" font-family="'Impact', 'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">4K IPTV</text>
</svg>
