<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#191919"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#darkBg)"/>

  <!-- Top bar with Cineva logo -->
  <rect width="1280" height="65" fill="#141414"/>
  <g transform="translate(48, 12)">
    <rect width="40" height="40" rx="8" fill="#0c1427"/>
    <image href="/images/logo.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
    <text x="52" y="28" font-family="'Impact', 'Bebas Neue', sans-serif" font-size="28" font-weight="bold" fill="#E50914" letter-spacing="2">CINEVA</text>
    <text x="165" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">TOP 10 HOJE</text>
  </g>

  <!-- Categories Pill Bar -->
  <g transform="translate(48, 80)">
    <rect x="0" y="0" width="70" height="32" rx="16" fill="#ffffff"/>
    <text x="35" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#141414" text-anchor="middle">Tudo</text>

    <rect x="80" y="0" width="80" height="32" rx="16" fill="#262626"/>
    <text x="120" y="21" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Séries</text>

    <rect x="170" y="0" width="80" height="32" rx="16" fill="#262626"/>
    <text x="210" y="21" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Filmes</text>

    <rect x="260" y="0" width="120" height="32" rx="16" fill="#E50914"/>
    <text x="320" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Canais IPTV</text>

    <rect x="390" y="0" width="90" height="32" rx="16" fill="#262626"/>
    <text x="435" y="21" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Infantil</text>
  </g>

  <!-- Section Title -->
  <text x="48" y="150" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Top 10 em Filmes e Séries no Brasil Hoje</text>

