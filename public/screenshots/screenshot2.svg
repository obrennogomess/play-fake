      <g transform="translate(65, 10)">
        <rect width="155" height="230" rx="6" fill="#022c22" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <rect x="8" y="8" width="40" height="16" rx="2" fill="#E50914"/>
