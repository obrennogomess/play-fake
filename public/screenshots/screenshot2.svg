      <text x="35" y="220" font-family="'Impact', sans-serif" font-size="240" font-weight="900" fill="#141414" stroke="#595959" stroke-width="4" text-anchor="middle">3</text>
      <g transform="translate(65, 10)">
        <rect width="155" height="230" rx="6" fill="#450a0a" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <rect x="8" y="8" width="40" height="16" rx="2" fill="#E50914"/>
        <text x="28" y="20" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">TOP 10</text>
