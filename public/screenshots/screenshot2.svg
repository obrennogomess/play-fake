        <text x="28" y="20" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">TOP 10</text>
        <circle cx="77" cy="90" r="35" fill="#ec4899" opacity="0.2"/>
        <text x="77" y="85" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">DIVERTIDA</text>
        <text x="77" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ec4899" text-anchor="middle">MENTE 2</text>
        <rect x="10" y="190" width="135" height="24" rx="4" fill="#E50914"/>
        <text x="77" y="206" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Assistir no Cineva</text>
