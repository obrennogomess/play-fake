        <rect width="155" height="230" rx="6" fill="#1e1b4b" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <rect x="8" y="8" width="40" height="16" rx="2" fill="#E50914"/>
        <text x="28" y="20" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">TOP 10</text>
        <circle cx="77" cy="90" r="35" fill="#f59e0b" opacity="0.2"/>
        <text x="77" y="85" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">A CASA DO</text>
        <text x="77" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">DRAGÃO T2</text>
