      <text x="112" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">AVATAR: O CAMINHO DA ÁGUA</text>
      <text x="112" y="85" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Áudio 5.1 • 4K HDR</text>

      <rect x="240" y="0" width="224" height="125" rx="5" fill="#1e1b4b"/>
      <text x="352" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">THE LAST OF US • T2</text>
      <text x="352" y="85" font-family="sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">HBO Max no Cineva</text>

      <rect x="480" y="0" width="224" height="125" rx="5" fill="#064e3b"/>
      <text x="592" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BRASILEIRÃO 4K AO VIVO</text>
      <text x="592" y="85" font-family="sans-serif" font-size="11" fill="#46d369" text-anchor="middle">Todos os Jogos da Rodada</text>

      <rect x="720" y="0" width="224" height="125" rx="5" fill="#3b0764"/>
      <text x="832" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">WANDINHA • TEMPORADA 2</text>
      <text x="832" y="85" font-family="sans-serif" font-size="11" fill="#ec4899" text-anchor="middle">Sucesso Mundial</text>

      <rect x="960" y="0" width="224" height="125" rx="5" fill="#451a03"/>
      <text x="1072" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">OPERAÇÃO LIONESS</text>
      <text x="1072" y="85" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Ação e Espionagem</text>
