        <text x="77" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DEADPOOL &amp;</text>
        <text x="77" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">WOLVERINE</text>
