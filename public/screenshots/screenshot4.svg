<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="modalOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#181818" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#181818" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Darkened background behind modal -->
  <rect width="1280" height="720" fill="#0a0a0a" opacity="0.95"/>

  <!-- Main Netflix Modal Container -->
  <g transform="translate(200, 30)">
    <rect width="880" height="660" rx="14" fill="#181818" stroke="#333" stroke-width="1"/>

    <!-- Header / Backdrop banner -->
    <rect width="880" height="320" rx="14" fill="#312e81"/>
    <!-- Gradient on backdrop -->
    <rect width="880" height="320" rx="14" fill="url(#modalOverlay)"/>

    <!-- Close button top right -->
    <circle cx="845" cy="35" r="18" fill="#181818"/>
    <text x="845" y="41" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">✕</text>

    <!-- Cineva Logo in Modal -->
    <g transform="translate(40, 25)">
      <rect width="36" height="36" rx="7" fill="#0c1427"/>
      <image href="/images/logo.png" x="0" y="0" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
      <text x="48" y="25" font-family="'Impact', sans-serif" font-size="22" font-weight="bold" fill="#E50914" letter-spacing="1.5">CINEVA</text>
    </g>

    <!-- Movie Title on Backdrop -->
    <g transform="translate(40, 150)">
      <text x="0" y="50" font-family="'Impact', 'Helvetica Neue', sans-serif" font-size="48" font-weight="bold" fill="#ffffff">DUNA: PARTE 2</text>
      
      <!-- Action Buttons -->
      <g transform="translate(0, 80)">
        <rect width="135" height="40" rx="6" fill="#ffffff"/>
        <polygon points="24,14 24,26 34,20" fill="#141414"/>
        <text x="45" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#141414">Assistir</text>

        <circle cx="165" cy="20" r="20" fill="rgba(42,42,42,0.8)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <text x="165" y="26" font-family="sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">+</text>

        <circle cx="220" cy="20" r="20" fill="rgba(42,42,42,0.8)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <text x="220" y="25" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">👍</text>
      </g>
    </g>

    <!-- Details Columns -->
    <g transform="translate(40, 340)">
      <!-- Left column: Meta + Synopsis -->
      <g transform="translate(0, 0)">
        <text x="0" y="16" font-family="sans-serif" font-size="14" font-weight="bold" fill="#46d369">98% relevante</text>
        <text x="110" y="16" font-family="sans-serif" font-size="14" fill="#a3a3a3">2024</text>
        <text x="160" y="16" font-family="sans-serif" font-size="14" fill="#a3a3a3">2h 46m</text>
        
        <rect x="225" y="3" width="30" height="18" rx="2" fill="#333333" stroke="#666666" stroke-width="1"/>
        <text x="240" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">14</text>

        <rect x="265" y="3" width="65" height="18" rx="2" fill="transparent" stroke="#a3a3a3" stroke-width="1"/>
        <text x="297" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">ULTRA HD</text>

        <rect x="338" y="3" width="65" height="18" rx="2" fill="transparent" stroke="#a3a3a3" stroke-width="1"/>
        <text x="370" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">ÁUDIO 5.1</text>

        <text x="0" y="55" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="500" width="480">Paul Atreides se une a Chani e aos Fremen em busca de vingança contra</text>
        <text x="0" y="75" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="500" width="480">aqueles que destruíram sua família. Uma jornada mística e grandiosa.</text>
        <text x="0" y="95" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="500" width="480">Disponível completo com áudio original, dublado em português e legendas.</text>
      </g>

      <!-- Right column: Cast / Genres -->
      <g transform="translate(540, 0)">
        <text x="0" y="16" font-family="sans-serif" font-size="13" fill="#777777">Elenco: <tspan fill="#ffffff">Timothée Chalamet, Zendaya, Rebecca Ferguson</tspan></text>
        <text x="0" y="42" font-family="sans-serif" font-size="13" fill="#777777">Gêneros: <tspan fill="#ffffff">Ficção Científica, Ação, Aventura Épica</tspan></text>
        <text x="0" y="68" font-family="sans-serif" font-size="13" fill="#777777">Cenas: <tspan fill="#ffffff">Empolgantes, Visuais de tirar o fôlego</tspan></text>
      </g>
    </g>

    <!-- Bottom Section: Títulos semelhantes no Cineva -->
    <g transform="translate(40, 480)">
      <text x="0" y="0" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Títulos semelhantes no Cineva</text>

      <g transform="translate(0, 16)">
        <!-- Similar 1 -->
        <rect x="0" y="0" width="185" height="125" rx="6" fill="#222" stroke="#333" stroke-width="1"/>
        <text x="92" y="55" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">INTERESTELAR</text>
        <text x="92" y="75" font-family="sans-serif" font-size="11" fill="#46d369" text-anchor="middle">97% relevante</text>
        <rect x="8" y="95" width="169" height="20" rx="3" fill="#E50914"/>
        <text x="92" y="109" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Assistir no Cineva</text>

        <!-- Similar 2 -->
        <rect x="205" y="0" width="185" height="125" rx="6" fill="#222" stroke="#333" stroke-width="1"/>
        <text x="297" y="55" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">BLADE RUNNER 2049</text>
        <text x="297" y="75" font-family="sans-serif" font-size="11" fill="#46d369" text-anchor="middle">95% relevante</text>
        <rect x="213" y="95" width="169" height="20" rx="3" fill="#E50914"/>
        <text x="297" y="109" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Assistir no Cineva</text>

        <!-- Similar 3 -->
        <rect x="410" y="0" width="185" height="125" rx="6" fill="#222" stroke="#333" stroke-width="1"/>
        <text x="502" y="55" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">A ORIGEM (INCEPTION)</text>
        <text x="502" y="75" font-family="sans-serif" font-size="11" fill="#46d369" text-anchor="middle">96% relevante</text>
        <rect x="418" y="95" width="169" height="20" rx="3" fill="#E50914"/>
        <text x="502" y="109" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Assistir no Cineva</text>

        <!-- Similar 4 -->
        <rect x="615" y="0" width="185" height="125" rx="6" fill="#222" stroke="#333" stroke-width="1"/>
        <text x="707" y="55" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">MATRIX RESURRECTIONS</text>
        <text x="707" y="75" font-family="sans-serif" font-size="11" fill="#46d369" text-anchor="middle">93% relevante</text>
        <rect x="623" y="95" width="169" height="20" rx="3" fill="#E50914"/>
        <text x="707" y="109" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Assistir no Cineva</text>
      </g>
    </g>
  </g>
</svg>