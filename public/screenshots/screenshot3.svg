        <text x="37" y="23" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">AO VIVO</text>
        <text x="112" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#a855f7" text-anchor="middle">HBO SIGNATURE</text>
        <text x="112" y="90" font-family="sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Succession • Temp 4</text>
        <text x="112" y="110" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">EPG: 18:00 - 19:15</text>
