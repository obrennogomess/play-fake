        <text x="112" y="110" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">EPG: 17:30 - 19:10</text>
      </g>

      <!-- Channel 3: Warner Channel -->
      <g transform="translate(480, 0)">
