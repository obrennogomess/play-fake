<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#141414"/>

  <!-- Top bar -->
  <rect width="1280" height="65" fill="#181818"/>
  <g transform="translate(48, 12)">
    <rect width="40" height="40" rx="8" fill="#0c1427"/>
    <image href="/images/logo.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
    <text x="52" y="28" font-family="'Impact', 'Bebas Neue', sans-serif" font-size="28" font-weight="bold" fill="#E50914" letter-spacing="2">CINEVA</text>
    <text x="165" y="27" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">CANAIS AO VIVO (IPTV 4K)</text>
  </g>

  <!-- Live Sports Row Header -->
  <g transform="translate(48, 95)">
    <div style="display:flex">
      <text x="0" y="0" font-family="sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Futebol e Esportes Ao Vivo Sem Delay</text>
      <text x="420" y="0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E50914">● TRANSMISSÃO EM 60 FPS</text>
    </div>

    <!-- Cards Row -->
    <g transform="translate(0, 20)">
      <!-- Live Card 1: Premiere 1 -->
      <g transform="translate(0, 0)">
        <rect width="280" height="175" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <rect x="12" y="12" width="70" height="22" rx="4" fill="#E50914"/>
        <text x="47" y="27" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">● AO VIVO</text>
        <rect x="88" y="12" width="50" height="22" rx="4" fill="#01875f"/>
        <text x="113" y="27" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4K</text>
        <text x="140" y="75" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">PREMIERE 1 HD</text>
        <text x="140" y="102" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Flamengo x Palmeiras</text>
        <text x="140" y="125" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Brasileirão Série A • 2º Tempo</text>
        <rect x="12" y="140" width="256" height="24" rx="4" fill="#E50914"/>
        <text x="140" y="156" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Assistir no Cineva (Zero Delay)</text>
      </g>

      <!-- Live Card 2: ESPN 4K -->
      <g transform="translate(295, 0)">
        <rect width="280" height="175" rx="8" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
        <rect x="12" y="12" width="70" height="22" rx="4" fill="#E50914"/>
        <text x="47" y="27" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">● AO VIVO</text>
        <rect x="88" y="12" width="50" height="22" rx="4" fill="#01875f"/>
        <text x="113" y="27" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4K</text>
        <text x="140" y="75" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">ESPN 4K BRASIL</text>
        <text x="140" y="102" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f87171" text-anchor="middle">Real Madrid x Man City</text>
        <text x="140" y="125" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Champions League • Semifinal</text>
        <rect x="12" y="140" width="256" height="24" rx="4" fill="#E50914"/>
        <text x="140" y="156" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Assistir no Cineva (Zero Delay)</text>
      </g>

      <!-- Live Card 3: SporTV 1 FHD -->
      <g transform="translate(590, 0)">
        <rect width="280" height="175" rx="8" fill="#022c22" stroke="#064e3b" stroke-width="1.5"/>
        <rect x="12" y="12" width="70" height="22" rx="4" fill="#E50914"/>
        <text x="47" y="27" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">● AO VIVO</text>
        <text x="140" y="75" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">SPORTV 1 FHD</text>
        <text x="140" y="102" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4ade80" text-anchor="middle">Copa do Brasil Decisão</text>
        <text x="140" y="125" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">São Paulo x Corinthians</text>
        <rect x="12" y="140" width="256" height="24" rx="4" fill="#E50914"/>
        <text x="140" y="156" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Assistir no Cineva (Zero Delay)</text>
