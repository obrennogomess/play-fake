      <g transform="translate(885, 0)">
        <rect width="280" height="175" rx="8" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5"/>
        <rect x="12" y="12" width="70" height="22" rx="4" fill="#E50914"/>
        <text x="47" y="27" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">● AO VIVO</text>
        <rect x="88" y="12" width="50" height="22" rx="4" fill="#01875f"/>
        <text x="113" y="27" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">60 FPS</text>
        <text x="140" y="75" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">CAZÉTV EXCLUSIVO</text>
        <text x="140" y="102" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f472b6" text-anchor="middle">Torneio Internacional</text>
        <text x="140" y="125" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Narração Ao Vivo • 140k Online</text>
        <rect x="12" y="140" width="256" height="24" rx="4" fill="#E50914"/>
        <text x="140" y="156" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Assistir no Cineva (Zero Delay)</text>
