  <!-- Bottom features bar -->
  <g transform="translate(48, 560)">
    <rect width="1184" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Grade EPG Completa</text>
    <text x="240" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">Troca Rápida de Canais</text>
    <text x="500" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4ade80">Sem Travamento 4K</text>
    <text x="730" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fbbf24">Áudio Multicanal 5.1</text>
    <text x="960" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#E50914">Controle Parental PIN</text>
  </g>
