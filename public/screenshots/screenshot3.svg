        <rect x="10" y="10" width="55" height="18" rx="3" fill="#E50914"/>
        <text x="37" y="23" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">AO VIVO</text>
        <text x="112" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">WARNER BROS TV</text>
        <text x="112" y="90" font-family="sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">The Big Bang Theory</text>
        <text x="112" y="110" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">EPG: 18:30 - 19:00</text>
      </g>

      <!-- Channel 4: Discovery Kids -->
      <g transform="translate(720, 0)">
        <rect width="224" height="140" rx="6" fill="#831843" stroke="#9d174d" stroke-width="1"/>
        <rect x="10" y="10" width="55" height="18" rx="3" fill="#E50914"/>
        <text x="37" y="23" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">AO VIVO</text>
        <text x="112" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ec4899" text-anchor="middle">DISCOVERY KIDS</text>
        <text x="112" y="90" font-family="sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Peppa Pig &amp; Amigos</text>
        <text x="112" y="110" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">EPG: 17:00 - 18:45</text>
      </g>

      <!-- Channel 5: National Geographic -->
      <g transform="translate(960, 0)">
        <rect width="224" height="140" rx="6" fill="#365314" stroke="#4d7c0f" stroke-width="1"/>
        <rect x="10" y="10" width="55" height="18" rx="3" fill="#E50914"/>
        <text x="37" y="23" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">AO VIVO</text>
        <text x="112" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#a3e635" text-anchor="middle">NAT GEO WILD</text>
        <text x="112" y="90" font-family="sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Planeta Selvagem 4K</text>
        <text x="112" y="110" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">EPG: 18:00 - 20:00</text>
